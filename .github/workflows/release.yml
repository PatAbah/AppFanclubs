name: Build client releases
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag
        required: true
        default: v1.1.1
      update_tag:
        description: Update the existing release tag to the built commit
        type: boolean
        default: false
  push:
    tags:
      - 'v*'
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:desktop
      - run: npm run desktop:build
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: windows-client
          path: |
            release/1.1.1/*.exe
            release/1.1.1/appfanclubs.config.json
  macos:
    runs-on: macos-latest
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:desktop
      - run: node -e "require('./desktop/discover-macos.cjs').discoverMacApps().then(r=>{console.log('Detected apps:',r.apps.length,'Complete:',r.complete);if(!r.apps.length)process.exit(1)})"
      - run: npm run desktop:build:mac
      - name: Check packaged macOS runtime
        run: |
          node -e "const {spawnSync}=require('node:child_process');const folder=process.arch==='arm64'?'mac-arm64':'mac';const result=spawnSync('release/1.1.1/'+folder+'/AppFanclubs.app/Contents/MacOS/AppFanclubs',['-e','console.log(process.platform,process.arch)'],{env:{...process.env,ELECTRON_RUN_AS_NODE:'1'},stdio:'inherit',timeout:15000});if(result.error)throw result.error;process.exit(result.status??1)"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: macos-client
          path: |
            release/1.1.1/*.dmg
            release/1.1.1/*.zip
  publish:
    needs: [windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8.0.2
        with:
          path: release-assets
          merge-multiple: true
      - if: inputs.update_tag
        run: gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/$RELEASE_TAG" -f sha="$GITHUB_SHA"
      - run: |
          gh release view "$RELEASE_TAG" || gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" --title "AppFanclubs ${RELEASE_TAG#v}" --notes-file RELEASE_NOTES.md
          cd release-assets
          sha256sum * > SHA256SUMS.txt
          gh release upload "$RELEASE_TAG" * --clobber --repo "$GITHUB_REPOSITORY"
